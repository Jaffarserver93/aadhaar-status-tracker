<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadhaar & Govt Status Tracker - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800/90 border border-slate-700/80 backdrop-blur rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl mb-3 shadow-lg shadow-indigo-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-white">Status Tracker</h2>
      <p class="text-sm text-slate-400 mt-1">Automated UIDAI & Govt Application Monitoring</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm rounded-xl"></div>

    <!-- Auth Form -->
    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
        <input id="username" type="text" required autocomplete="username" class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all placeholder-slate-500 text-sm" placeholder="Enter username">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
        <input id="password" type="password" required autocomplete="current-password" class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all placeholder-slate-500 text-sm" placeholder="Min 6 characters">
      </div>
      
      <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all text-white text-sm">
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-400">
      <span id="togglePrompt">Don't have an account?</span>
      <button type="button" id="toggleModeBtn" class="text-indigo-400 hover:text-indigo-300 underline font-medium ml-1">Create an account</button>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    const form = document.getElementById('authForm');
    const toggleBtn = document.getElementById('toggleModeBtn');
    const submitBtn = document.getElementById('submitBtn');
    const togglePrompt = document.getElementById('togglePrompt');
    const alertBox = document.getElementById('alertBox');

    // Check if session exists
    fetch('/api/me')
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) window.location.href = '/dashboard.html';
      })
      .catch(() => {});

    toggleBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      submitBtn.innerText = isRegisterMode ? 'Register Account' : 'Sign In';
      togglePrompt.innerText = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
      toggleBtn.innerText = isRegisterMode ? 'Sign In' : 'Create an account';
      alertBox.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const endpoint = isRegisterMode ? '/api/register' : '/api/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Authentication failed');
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerText = err.message;
        alertBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
