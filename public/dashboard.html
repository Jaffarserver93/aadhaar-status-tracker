<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadhaar & Govt Status Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Top Navigation -->
  <nav class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-xl shadow-md shadow-indigo-600/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <span class="font-bold text-base tracking-wide text-white">Govt Status Tracker</span>
          <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] bg-slate-800 text-slate-400 border border-slate-700 rounded-full font-mono">1h cron active</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="toggleLiveViewBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition-all flex items-center gap-2">
          <span id="livePulse" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span>Live Browser Stream</span>
        </button>
        <span id="userBadge" class="text-xs sm:text-sm text-slate-400 font-medium px-3 py-1.5 bg-slate-800/60 rounded-lg border border-slate-700/50"></span>
        <button id="addTrackerBtn" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition-all shadow-md shadow-indigo-600/20 flex items-center gap-1.5 text-white">
          <span class="text-base leading-none">+</span> Add Tracker
        </button>
        <button id="logoutBtn" class="px-3 py-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg text-sm font-medium transition-all">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Pipeline Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <!-- Live Browser Preview Panel (Development Mode) -->
    <div id="liveViewContainer" class="bg-slate-900 border border-indigo-500/30 rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></div>
          <h3 class="font-bold text-sm tracking-wide text-indigo-400 uppercase">Live Headless Browser Stream (1s refresh)</h3>
        </div>
        <div class="flex items-center gap-2 text-xs font-mono text-slate-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
          <span class="text-slate-500">Log:</span>
          <span id="liveStatusText" class="text-indigo-300 font-medium truncate max-w-xs sm:max-w-md">Idle</span>
        </div>
      </div>

      <!-- Screenshot Display Container -->
      <div class="relative bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center min-h-[320px] max-h-[480px]">
        <img id="liveBrowserImage" src="/api/debug/screenshot" alt="Live Browser View" class="w-full h-auto object-contain max-h-[480px]">
        <div id="liveStreamWatermark" class="absolute bottom-3 right-3 bg-black/70 backdrop-blur px-2.5 py-1 rounded text-[10px] font-mono text-slate-400 border border-slate-700">
          FPS: ~1 frame/sec
        </div>
      </div>
    </div>

    <!-- Top Info Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/60 border border-slate-800 p-4 rounded-xl">
      <div>
        <h2 class="text-lg font-bold text-white">Tracking Pipelines</h2>
        <p class="text-xs text-slate-400">Automated status checker verifies EID, SRN, URN, and SID numbers every hour.</p>
      </div>
      <button id="refreshBtn" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg transition-all flex items-center gap-2 self-start sm:self-auto">
        <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Refresh Dashboard
      </button>
    </div>

    <!-- 3-Column Pipeline Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- ⏳ In Progress Column -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl flex flex-col min-h-[500px]">
        <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-amber-400">⏳</span>
            <h3 class="font-semibold text-sm text-slate-200 uppercase tracking-wide">In Progress</h3>
          </div>
          <span id="processingCount" class="text-xs bg-amber-500/10 border border-amber-500/20 px-2.5 py-0.5 rounded-full text-amber-400 font-mono font-medium">0</span>
        </div>
        <div id="processingList" class="p-4 space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- ✅ Completed Column -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl flex flex-col min-h-[500px]">
        <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-emerald-400">✅</span>
            <h3 class="font-semibold text-sm text-slate-200 uppercase tracking-wide">Completed</h3>
          </div>
          <span id="completedCount" class="text-xs bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full text-emerald-400 font-mono font-medium">0</span>
        </div>
        <div id="completedList" class="p-4 space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- ❌ Action Required / Failed Column -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl flex flex-col min-h-[500px]">
        <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-rose-400">❌</span>
            <h3 class="font-semibold text-sm text-slate-200 uppercase tracking-wide">Action Required / Failed</h3>
          </div>
          <span id="failedCount" class="text-xs bg-rose-500/10 border border-rose-500/20 px-2.5 py-0.5 rounded-full text-rose-400 font-mono font-medium">0</span>
        </div>
        <div id="failedList" class="p-4 space-y-3 flex-1 overflow-y-auto"></div>
      </div>

    </div>
  </main>

  <!-- Add Tracker Modal -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-white">Add New Application Tracker</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div id="modalError" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-xl"></div>

      <form id="addTrackerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Tracking Type</label>
          <select id="trackerType" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="EID">Enrolment ID (EID - 28 Digits)</option>
            <option value="SRN">Service Request Number (SRN)</option>
            <option value="URN">Update Request Number (URN)</option>
            <option value="SID">Session / Case ID (SID)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Identifier / Reference Number</label>
          <input id="trackerNumber" type="text" required placeholder="e.g. 1234/12345/12345" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex justify-end gap-3 pt-3">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 text-slate-400 hover:text-slate-200 hover:bg-slate-700/60 rounded-xl text-sm font-medium transition-all">Cancel</button>
          <button type="submit" id="saveTrackerBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition-all">Start Tracking</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
