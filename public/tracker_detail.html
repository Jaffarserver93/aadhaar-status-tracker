<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadhaar Dossier Inspector - Fieldnotes</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
            mono: ['DM Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[hsl(var(--background))] text-[hsl(var(--foreground))] min-h-screen flex flex-col font-sans selection:bg-[hsla(var(--primary),0.2)]">

  <!-- Top Dark Slate Archival Nav -->
  <nav class="bg-[hsl(var(--sidebar))] text-[hsl(var(--sidebar-foreground))] border-b border-[hsl(var(--sidebar-border))] sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/dashboard.html" class="px-2.5 py-1.5 bg-[hsl(var(--sidebar-accent))] hover:bg-[hsl(var(--sidebar-border))] text-[hsl(var(--sidebar-foreground))] border border-[hsl(var(--sidebar-border))] rounded-[calc(var(--radius)-3px)] transition-colors flex items-center gap-1.5 text-xs font-mono">
          <span>&larr;</span>
          <span>Ledger</span>
        </a>
        <span class="text-[hsl(var(--sidebar-border))] font-mono">/</span>
        <div class="flex items-center gap-2">
          <span class="font-serif text-base tracking-tight text-[hsl(var(--sidebar-foreground))] font-normal">Dossier Inspector</span>
          <span class="hidden sm:inline-block px-1.5 py-0.5 text-[9px] bg-[hsl(var(--sidebar-accent))] text-[hsl(var(--sidebar-primary))] border border-[hsl(var(--sidebar-border))] rounded font-mono uppercase tracking-wider">Live Tathya API</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="recheckBtn" class="btn-primary px-3 py-1.5 text-xs font-mono uppercase tracking-wider flex items-center gap-1.5 transition-all shadow-sm group">
          <svg id="recheckIcon" class="w-3.5 h-3.5 transition-transform group-hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Re-verify Now</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6 flex-1 w-full">
    
    <!-- Loading Skeleton -->
    <div id="loadingBox" class="p-12 text-center text-[hsl(var(--muted-foreground))] text-xs font-mono">
      <div class="w-6 h-6 border-2 border-[hsl(var(--primary))] border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      Querying live UIDAI Tathya status dossier...
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="hidden p-5 bg-[hsla(var(--accent),0.12)] border border-[hsla(var(--accent),0.35)] text-[hsl(16,60%,36%)] font-mono text-xs rounded-[calc(var(--radius)-2px)] text-center"></div>

    <!-- Main Content Container -->
    <div id="contentContainer" class="hidden space-y-6">
      
      <!-- Tracker Overview Card -->
      <div class="paper-card p-6 flex flex-col md:flex-row md:items-start justify-between gap-6">
        <div class="space-y-2.5 max-w-2xl">
          <div class="flex items-center gap-2.5">
            <span id="typeBadge" class="font-mono text-[10px] font-medium px-2 py-0.5 rounded bg-[hsl(var(--secondary))] text-[hsl(var(--secondary-foreground))] border border-[hsl(var(--border))] uppercase tracking-wider"></span>
            <span id="statusBadge"></span>
          </div>
          <h1 id="identifierText" class="font-mono text-2xl sm:text-3xl font-bold tracking-wider text-[hsl(var(--foreground))]"></h1>
          <p id="detailsText" class="font-sans text-xs sm:text-sm text-[hsl(var(--muted-foreground))] leading-relaxed pt-1"></p>
        </div>

        <!-- Archival Ledger Box -->
        <div class="text-left md:text-right text-[11px] font-mono text-[hsl(var(--muted-foreground))] space-y-1.5 bg-[hsl(var(--background))] p-4 rounded-[calc(var(--radius)-2px)] border border-[hsl(var(--border))] shrink-0">
          <div class="flex md:justify-end gap-3">
            <span class="text-[hsl(var(--muted-foreground))]/70 uppercase">FIRST LOGGED:</span>
            <span id="createdText" class="text-[hsl(var(--foreground))] font-medium"></span>
          </div>
          <div class="flex md:justify-end gap-3">
            <span class="text-[hsl(var(--muted-foreground))]/70 uppercase">LAST VERIFIED:</span>
            <span id="lastCheckedText" class="text-[hsl(var(--foreground))] font-medium"></span>
          </div>
          <div class="flex md:justify-end gap-3 pt-1 border-t border-[hsl(var(--border))]">
            <span class="text-[hsl(var(--muted-foreground))]/70 uppercase">AUDIT CHECKS:</span>
            <span id="totalChecksText" class="text-[hsl(var(--primary))] font-bold"></span>
          </div>
        </div>
      </div>

      <!-- Two-Column Layout: Live JSON Viewer & History Timeline -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Column: Live JSON Inspector -->
        <div class="lg:col-span-7 paper-card p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-[hsl(var(--card-border))] pb-3">
            <div class="flex items-center gap-2">
              <span class="font-mono text-sm text-[hsl(var(--primary))]">{ }</span>
              <h3 class="font-serif text-sm font-normal text-[hsl(var(--card-foreground))]">Live UIDAI Tathya Response</h3>
            </div>
            <button id="copyJsonBtn" class="btn-secondary px-2.5 py-1 text-[11px] font-mono flex items-center gap-1.5">
              <svg class="w-3 h-3 text-[hsl(var(--muted-foreground))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              <span>Copy Payload</span>
            </button>
          </div>

          <!-- Tabs: Raw JSON vs Stages -->
          <div class="flex gap-2 border-b border-[hsl(var(--card-border))] pb-2">
            <button id="tabRawJson" class="btn-primary px-3 py-1 text-xs font-mono">Raw JSON Payload</button>
            <button id="tabStages" class="btn-secondary px-3 py-1 text-xs font-mono">Verification Stages</button>
          </div>

          <!-- Raw JSON View -->
          <div id="rawJsonSection" class="relative rounded-[calc(var(--radius)-2px)] overflow-hidden border border-[hsl(var(--sidebar-border))] bg-[hsl(var(--sidebar))] p-4">
            <pre id="jsonDisplay" class="text-xs font-mono text-[hsl(var(--sidebar-primary))] overflow-x-auto max-h-[500px] scrollbar-thin whitespace-pre leading-relaxed select-all">Loading JSON...</pre>
          </div>

          <!-- Stages Breakdown View -->
          <div id="stagesSection" class="hidden space-y-3 max-h-[500px] overflow-y-auto pr-1">
            <div id="stagesList" class="space-y-2.5"></div>
          </div>
        </div>

        <!-- Right Column: Check History Timeline -->
        <div class="lg:col-span-5 paper-card p-5 space-y-4 flex flex-col max-h-[620px]">
          <div class="flex items-center justify-between border-b border-[hsl(var(--card-border))] pb-3">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-[hsl(var(--primary))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <h3 class="font-serif text-sm font-normal text-[hsl(var(--card-foreground))]">Audit Trail Ledger</h3>
            </div>
            <span id="historyCountBadge" class="text-[10px] bg-[hsl(var(--secondary))] text-[hsl(var(--secondary-foreground))] border border-[hsl(var(--border))] px-2 py-0.5 rounded font-mono">0 checks</span>
          </div>

          <div id="historyList" class="space-y-2.5 overflow-y-auto flex-1 pr-1"></div>
        </div>

      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let identifier = window.location.pathname.replace(/^\/+/, '');
      if (!identifier || identifier === 'tracker_detail.html') {
        const params = new URLSearchParams(window.location.search);
        identifier = params.get('id') || params.get('identifier');
      }

      if (!identifier) {
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('errorBox').innerText = 'No reference identifier provided in URL.';
        document.getElementById('errorBox').classList.remove('hidden');
        return;
      }

      let currentTrackerId = null;
      let currentJsonString = '{}';

      // Tab handlers
      const tabRaw = document.getElementById('tabRawJson');
      const tabStages = document.getElementById('tabStages');
      const rawSec = document.getElementById('rawJsonSection');
      const stagesSec = document.getElementById('stagesSection');

      tabRaw.addEventListener('click', () => {
        tabRaw.className = 'btn-primary px-3 py-1 text-xs font-mono';
        tabStages.className = 'btn-secondary px-3 py-1 text-xs font-mono';
        rawSec.classList.remove('hidden');
        stagesSec.classList.add('hidden');
      });

      tabStages.addEventListener('click', () => {
        tabStages.className = 'btn-primary px-3 py-1 text-xs font-mono';
        tabRaw.className = 'btn-secondary px-3 py-1 text-xs font-mono';
        stagesSec.classList.remove('hidden');
        rawSec.classList.add('hidden');
      });

      // Copy JSON button
      const copyBtn = document.getElementById('copyJsonBtn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(currentJsonString).then(() => {
          const original = copyBtn.innerHTML;
          copyBtn.innerHTML = `
            <svg class="w-3 h-3 text-[hsl(var(--primary))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
            <span>Copied!</span>
          `;
          setTimeout(() => copyBtn.innerHTML = original, 1500);
        });
      });

      async function loadDetails() {
        try {
          const res = await fetch(`/api/trackers/${encodeURIComponent(identifier)}/details`);
          if (res.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.error || 'Tracker not found.');
          }

          const { tracker, history } = await res.json();
          currentTrackerId = tracker.id;
          renderDetails(tracker, history);
        } catch (err) {
          document.getElementById('loadingBox').classList.add('hidden');
          document.getElementById('errorBox').innerText = err.message;
          document.getElementById('errorBox').classList.remove('hidden');
        }
      }

      function renderDetails(t, history) {
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('contentContainer').classList.remove('hidden');

        document.getElementById('typeBadge').innerText = t.type;
        if (t.type === 'EID' && (t.identifier_number || '').length === 28) {
          const enr = t.identifier_number.substring(0, 14);
          const formattedEnr = `${enr.slice(0, 4)}/${enr.slice(4, 9)}/${enr.slice(9, 14)}`;
          const yr = t.identifier_number.substring(14, 18);
          const mo = t.identifier_number.substring(18, 20);
          const da = t.identifier_number.substring(20, 22);
          const hr = t.identifier_number.substring(22, 24);
          const mi = t.identifier_number.substring(24, 26);
          const sc = t.identifier_number.substring(26, 28);
          document.getElementById('identifierText').innerHTML = `
            <span>${formattedEnr}</span>
            <div class="flex items-center gap-3 text-xs font-mono font-normal text-[hsl(var(--muted-foreground))] mt-1">
              <span class="inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-[hsl(var(--muted-foreground))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <span>${da}/${mo}/${yr}</span>
              </span>
              <span class="inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-[hsl(var(--muted-foreground))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>${hr}:${mi}:${sc}</span>
              </span>
              <span class="text-[hsl(var(--muted-foreground))]/70 font-mono text-[11px]">(${t.identifier_number})</span>
            </div>
          `;
        } else if (t.type === 'SID') {
          const sid = t.identifier_number || '';
          document.getElementById('identifierText').innerHTML = `
            <span>${sid}</span>
            <div class="flex items-center gap-2 text-xs font-mono font-normal text-[hsl(var(--muted-foreground))] mt-1">
              <span class="inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-[hsl(var(--muted-foreground))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
                <span>SID &bull; Physical Enrolment / Update Center Slip ('S' + 27 Digits)</span>
              </span>
            </div>
          `;
        } else {
          document.getElementById('identifierText').innerText = t.identifier_number;
        }

        document.getElementById('detailsText').innerText = t.status_details || 'No status details available.';
        document.getElementById('createdText').innerText = new Date(t.created_at).toLocaleString();
        document.getElementById('lastCheckedText').innerText = t.last_checked_at ? new Date(t.last_checked_at).toLocaleString() : 'Never';
        document.getElementById('totalChecksText').innerText = history.length;
        document.getElementById('historyCountBadge').innerText = `${history.length} checks`;

        // Status Badge
        const status = t.current_status || 'Processing';
        let badgeHtml = '';
        if (status === 'Completed') {
          badgeHtml = `
            <span class="inline-flex items-center gap-1.5 font-mono text-[10px] font-medium px-2.5 py-0.5 rounded bg-[hsla(var(--primary),0.12)] text-[hsl(var(--primary))] border border-[hsla(var(--primary),0.3)]">
              <svg class="w-3 h-3 text-[hsl(var(--primary))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Completed</span>
            </span>
          `;
        } else if (status === 'Processing') {
          badgeHtml = `
            <span class="inline-flex items-center gap-1.5 font-mono text-[10px] font-medium px-2.5 py-0.5 rounded bg-[hsla(var(--chart-4),0.15)] text-[hsl(39,60%,34%)] border border-[hsla(var(--chart-4),0.35)]">
              <svg class="w-3 h-3 animate-spin text-[hsl(39,60%,34%)]" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>In Progress</span>
            </span>
          `;
        } else {
          badgeHtml = `
            <span class="inline-flex items-center gap-1.5 font-mono text-[10px] font-medium px-2.5 py-0.5 rounded bg-[hsla(var(--accent),0.15)] text-[hsl(16,55%,42%)] border border-[hsla(var(--accent),0.35)]">
              <svg class="w-3 h-3 text-[hsl(16,55%,42%)] animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
              <span>Action Required</span>
            </span>
          `;
        }
        document.getElementById('statusBadge').innerHTML = badgeHtml;

        // Render JSON Data
        let parsed = null;
        try {
          parsed = typeof t.json_data === 'string' ? JSON.parse(t.json_data) : t.json_data;
        } catch (e) {}

        if (!parsed && history.length > 0) {
          try {
            parsed = typeof history[0].json_data === 'string' ? JSON.parse(history[0].json_data) : history[0].json_data;
          } catch (e) {}
        }

        currentJsonString = parsed ? JSON.stringify(parsed, null, 2) : (t.status_details ? JSON.stringify({ message: t.status_details }, null, 2) : '{}');
        document.getElementById('jsonDisplay').innerText = currentJsonString;

        // Render Stages Breakdown
        const stagesList = document.getElementById('stagesList');
        stagesList.innerHTML = '';
        if (parsed && parsed.statusData && parsed.statusData[0]?.stages) {
          const stages = parsed.statusData[0].stages;
          stages.forEach(st => {
            const isDone = st.state === 'COMPLETE';
            const isCurr = st.state === 'INPROGRESS';
            const badgeClass = isDone 
              ? 'bg-[hsla(var(--primary),0.12)] text-[hsl(var(--primary))] border-[hsla(var(--primary),0.25)]' 
              : (isCurr ? 'bg-[hsla(var(--chart-4),0.15)] text-[hsl(39,60%,34%)] border-[hsla(var(--chart-4),0.35)]' : 'bg-[hsl(var(--secondary))] text-[hsl(var(--muted-foreground))] border-[hsl(var(--border))]');
            const icon = isDone ? '✓' : (isCurr ? '⟳' : '○');

            let subStagesHtml = '';
            if (st.subStages && st.subStages.length > 0) {
              subStagesHtml = `
                <div class="mt-2.5 pt-2.5 border-t border-[hsl(var(--border))] space-y-1.5">
                  <div class="text-[10px] font-mono text-[hsl(var(--muted-foreground))] uppercase tracking-wider">Sub-Stages:</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                    ${st.subStages.map(sub => {
                      const isSubDone = sub.subStageStatus === 'COMPLETE';
                      const isSubCurr = sub.subStageStatus === 'INPROGRESS';
                      const subBadge = isSubDone ? 'bg-[hsla(var(--primary),0.12)] text-[hsl(var(--primary))] border-[hsla(var(--primary),0.25)]' : (isSubCurr ? 'bg-[hsla(var(--chart-4),0.15)] text-[hsl(39,60%,34%)] border-[hsla(var(--chart-4),0.35)]' : 'bg-[hsl(var(--card))] text-[hsl(var(--muted-foreground))] border-[hsl(var(--border))]');
                      const subIcon = isSubDone ? '✓' : (isSubCurr ? '⟳' : '○');
                      return `
                        <div class="flex items-center justify-between p-2 rounded bg-[hsl(var(--background))] border border-[hsl(var(--border))] text-[11px]">
                          <span class="text-[hsl(var(--foreground))] font-medium">${sub.subStageName}</span>
                          <span class="text-[9px] px-1.5 py-0.5 rounded font-mono border ${subBadge}">${sub.subStageStatus} ${subIcon}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }

            const item = document.createElement('div');
            item.className = 'bg-[hsl(var(--background))] border border-[hsl(var(--border))] rounded p-3 space-y-1';
            item.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="font-semibold text-xs text-[hsl(var(--foreground))]">${st.stageName}</span>
                <span class="text-[10px] px-2 py-0.5 rounded font-mono border ${badgeClass}">${st.state} ${icon}</span>
              </div>
              <p class="text-xs text-[hsl(var(--muted-foreground))]">${st.message || st.messageLocal || 'No stage message'}</p>
              ${subStagesHtml}
            `;
            stagesList.appendChild(item);
          });
        } else {
          stagesList.innerHTML = '<div class="text-xs font-mono text-[hsl(var(--muted-foreground))] italic p-4 text-center">No stage breakdown available in current response.</div>';
        }

        // Render History Timeline
        const histList = document.getElementById('historyList');
        histList.innerHTML = '';

        if (history.length === 0) {
          histList.innerHTML = '<div class="text-xs font-mono text-[hsl(var(--muted-foreground))] italic text-center py-6">No historical records in ledger yet.</div>';
        } else {
          history.forEach((h, index) => {
            const row = document.createElement('div');
            row.className = 'bg-[hsl(var(--background))] border border-[hsl(var(--border))] rounded p-3 space-y-2 hover:border-[hsl(var(--input))] transition-colors';

            const timeStr = new Date(h.checked_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });
            
            let statusPill = '';
            if (h.status === 'Completed') statusPill = '<span class="text-[10px] font-mono text-[hsl(var(--primary))] bg-[hsla(var(--primary),0.12)] border border-[hsla(var(--primary),0.3)] px-2 py-0.5 rounded">Completed</span>';
            else if (h.status === 'Processing') statusPill = '<span class="text-[10px] font-mono text-[hsl(39,60%,34%)] bg-[hsla(var(--chart-4),0.15)] border border-[hsla(var(--chart-4),0.35)] px-2 py-0.5 rounded">In Progress</span>';
            else statusPill = '<span class="text-[10px] font-mono text-[hsl(16,55%,42%)] bg-[hsla(var(--accent),0.15)] border border-[hsla(var(--accent),0.35)] px-2 py-0.5 rounded">Action Needed</span>';

            let hJsonPretty = '';
            try {
              const hj = typeof h.json_data === 'string' ? JSON.parse(h.json_data) : h.json_data;
              if (hj) hJsonPretty = JSON.stringify(hj, null, 2);
            } catch (e) {}

            row.innerHTML = `
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono text-[hsl(var(--muted-foreground))] font-bold">#${history.length - index}</span>
                  ${statusPill}
                </div>
                <span class="text-[10px] font-mono text-[hsl(var(--muted-foreground))]">${timeStr}</span>
              </div>
              <div class="text-xs text-[hsl(var(--foreground))] leading-relaxed font-sans">${h.status_details || 'Check completed.'}</div>
              ${hJsonPretty ? `
                <div class="pt-1 border-t border-[hsl(var(--border))]">
                  <button class="view-history-json text-[10px] font-mono text-[hsl(var(--primary))] hover:text-[hsl(var(--ring))] underline">View Stored JSON ▼</button>
                  <pre class="hist-pre hidden mt-2 p-2 bg-[hsl(var(--sidebar))] text-[hsl(var(--sidebar-primary))] border border-[hsl(var(--sidebar-border))] rounded text-[9px] font-mono overflow-x-auto max-h-28 scrollbar-thin whitespace-pre leading-tight select-all">${hJsonPretty}</pre>
                </div>
              ` : ''}
            `;

            const btn = row.querySelector('.view-history-json');
            if (btn) {
              const pre = row.querySelector('.hist-pre');
              btn.addEventListener('click', () => {
                pre.classList.toggle('hidden');
                btn.innerText = pre.classList.contains('hidden') ? 'View Stored JSON ▼' : 'Hide Stored JSON ▲';
              });
            }

            histList.appendChild(row);
          });
        }
      }

      // Re-check button
      const recheckBtn = document.getElementById('recheckBtn');
      const recheckIcon = document.getElementById('recheckIcon');
      recheckBtn.addEventListener('click', async () => {
        if (!currentTrackerId) return;
        recheckIcon.classList.add('animate-spin');
        recheckBtn.disabled = true;

        try {
          await fetch(`/api/trackers/${currentTrackerId}/check`, { method: 'POST' });
          setTimeout(async () => {
            await loadDetails();
            recheckIcon.classList.remove('animate-spin');
            recheckBtn.disabled = false;
          }, 2000);
        } catch (err) {
          alert('Failed to trigger re-check: ' + err.message);
          recheckIcon.classList.remove('animate-spin');
          recheckBtn.disabled = false;
        }
      });

      loadDetails();
    });
  </script>
</body>
</html>
