<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadhaar Status JSON Inspector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Top Nav -->
  <nav class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/dashboard.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all flex items-center gap-1.5 text-xs font-semibold">
          <span>&larr;</span> Back to Dashboard
        </a>
        <span class="text-slate-600">|</span>
        <span class="font-bold text-base text-white tracking-wide">Live API JSON Inspector</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="recheckBtn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-semibold transition-all shadow-md shadow-indigo-600/20 flex items-center gap-1.5 text-white">
          <span id="recheckIcon">🔄</span> Re-query API Now
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
    
    <!-- Loading Skeleton -->
    <div id="loadingBox" class="p-12 text-center text-slate-500 text-sm">
      <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      Querying live UIDAI Tathya status data...
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="hidden p-6 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl text-center"></div>

    <!-- Main Content Container -->
    <div id="contentContainer" class="hidden space-y-6">
      
      <!-- Tracker Overview Card -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div class="space-y-2">
          <div class="flex items-center gap-3">
            <span id="typeBadge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-950 text-indigo-300 border border-indigo-800 tracking-wider"></span>
            <span id="statusBadge"></span>
          </div>
          <h1 id="identifierText" class="text-2xl sm:text-3xl font-mono font-bold text-white tracking-wider"></h1>
          <p id="detailsText" class="text-sm text-slate-300 leading-relaxed max-w-2xl"></p>
        </div>

        <div class="text-left md:text-right text-xs text-slate-400 space-y-1 bg-slate-950/60 p-4 rounded-xl border border-slate-800">
          <div>Created: <span id="createdText" class="text-slate-300 font-medium font-mono"></span></div>
          <div>Last Checked: <span id="lastCheckedText" class="text-slate-300 font-medium font-mono"></span></div>
          <div>Total Checks: <span id="totalChecksText" class="text-indigo-400 font-bold font-mono"></span></div>
        </div>
      </div>

      <!-- Two-Column Layout: Live JSON Viewer & History Timeline -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Live JSON Inspector -->
        <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
              <span class="text-indigo-400 font-mono text-base">{ }</span>
              <h3 class="font-bold text-sm tracking-wide text-slate-200 uppercase">Live UIDAI API Response</h3>
            </div>
            <div class="flex items-center gap-2">
              <button id="copyJsonBtn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded text-xs font-mono font-medium transition-colors flex items-center gap-1">
                <span>📋</span> Copy JSON
              </button>
            </div>
          </div>

          <!-- Tabs: Raw JSON vs Stages -->
          <div class="flex gap-2 border-b border-slate-800 pb-2">
            <button id="tabRawJson" class="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-semibold transition-all">Raw JSON</button>
            <button id="tabStages" class="px-3 py-1 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs font-semibold transition-all">Stages Breakdown</button>
          </div>

          <!-- Raw JSON View -->
          <div id="rawJsonSection" class="relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800 p-4">
            <pre id="jsonDisplay" class="text-xs font-mono text-emerald-400 overflow-x-auto max-h-[500px] scrollbar-thin whitespace-pre leading-relaxed select-all">Loading JSON...</pre>
          </div>

          <!-- Stages Breakdown View -->
          <div id="stagesSection" class="hidden space-y-3 max-h-[500px] overflow-y-auto pr-1">
            <div id="stagesList" class="space-y-2.5"></div>
          </div>
        </div>

        <!-- Right Column: Check History Timeline -->
        <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4 flex flex-col max-h-[620px]">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
              <span class="text-emerald-400">🕒</span>
              <h3 class="font-bold text-sm tracking-wide text-slate-200 uppercase">API Check History</h3>
            </div>
            <span id="historyCountBadge" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">0 checks</span>
          </div>

          <div id="historyList" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
        </div>

      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let identifier = window.location.pathname.replace(/^\/+/, '');
      if (!identifier || identifier === 'tracker_detail.html') {
        const params = new URLSearchParams(window.location.search);
        identifier = params.get('id') || params.get('identifier');
      }

      if (!identifier) {
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('errorBox').innerText = 'No reference identifier provided in URL.';
        document.getElementById('errorBox').classList.remove('hidden');
        return;
      }

      let currentTrackerId = null;
      let currentJsonString = '{}';

      // Tab handlers
      const tabRaw = document.getElementById('tabRawJson');
      const tabStages = document.getElementById('tabStages');
      const rawSec = document.getElementById('rawJsonSection');
      const stagesSec = document.getElementById('stagesSection');

      tabRaw.addEventListener('click', () => {
        tabRaw.className = 'px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-semibold transition-all';
        tabStages.className = 'px-3 py-1 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs font-semibold transition-all';
        rawSec.classList.remove('hidden');
        stagesSec.classList.add('hidden');
      });

      tabStages.addEventListener('click', () => {
        tabStages.className = 'px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-semibold transition-all';
        tabRaw.className = 'px-3 py-1 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs font-semibold transition-all';
        stagesSec.classList.remove('hidden');
        rawSec.classList.add('hidden');
      });

      // Copy JSON button
      const copyBtn = document.getElementById('copyJsonBtn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(currentJsonString).then(() => {
          const original = copyBtn.innerHTML;
          copyBtn.innerHTML = '<span>✓</span> Copied!';
          setTimeout(() => copyBtn.innerHTML = original, 1500);
        });
      });

      async function loadDetails() {
        try {
          const res = await fetch(`/api/trackers/${encodeURIComponent(identifier)}/details`);
          if (res.status === 401) {
            window.location.href = '/';
            return;
          }
          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.error || 'Tracker not found.');
          }

          const { tracker, history } = await res.json();
          currentTrackerId = tracker.id;
          renderDetails(tracker, history);
        } catch (err) {
          document.getElementById('loadingBox').classList.add('hidden');
          document.getElementById('errorBox').innerText = err.message;
          document.getElementById('errorBox').classList.remove('hidden');
        }
      }

      function renderDetails(t, history) {
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('contentContainer').classList.remove('hidden');

        document.getElementById('typeBadge').innerText = t.type;
        document.getElementById('identifierText').innerText = t.identifier_number;
        document.getElementById('detailsText').innerText = t.status_details || 'No status details available.';
        document.getElementById('createdText').innerText = new Date(t.created_at).toLocaleString();
        document.getElementById('lastCheckedText').innerText = t.last_checked_at ? new Date(t.last_checked_at).toLocaleString() : 'Never';
        document.getElementById('totalChecksText').innerText = history.length;
        document.getElementById('historyCountBadge').innerText = `${history.length} checks`;

        // Status Badge
        const status = t.current_status || 'Processing';
        let badgeHtml = '';
        if (status === 'Completed') {
          badgeHtml = '<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">✓ Completed</span>';
        } else if (status === 'Processing') {
          badgeHtml = '<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20"><span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> In Progress</span>';
        } else {
          badgeHtml = '<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">⚠ Action Required / Failed</span>';
        }
        document.getElementById('statusBadge').innerHTML = badgeHtml;

        // Render JSON Data
        let parsed = null;
        try {
          parsed = typeof t.json_data === 'string' ? JSON.parse(t.json_data) : t.json_data;
        } catch (e) {}

        if (!parsed && history.length > 0) {
          try {
            parsed = typeof history[0].json_data === 'string' ? JSON.parse(history[0].json_data) : history[0].json_data;
          } catch (e) {}
        }

        currentJsonString = parsed ? JSON.stringify(parsed, null, 2) : (t.status_details ? JSON.stringify({ message: t.status_details }, null, 2) : '{}');
        document.getElementById('jsonDisplay').innerText = currentJsonString;

        // Render Stages Breakdown
        const stagesList = document.getElementById('stagesList');
        stagesList.innerHTML = '';
        if (parsed && parsed.statusData && parsed.statusData[0]?.stages) {
          const stages = parsed.statusData[0].stages;
          stages.forEach(st => {
            const isDone = st.state === 'COMPLETE';
            const isCurr = st.state === 'INPROGRESS';
            const badgeClass = isDone 
              ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
              : (isCurr ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-slate-800 text-slate-500 border-slate-700');
            const icon = isDone ? '✓' : (isCurr ? '⟳' : '○');

            const item = document.createElement('div');
            item.className = 'bg-slate-950/70 border border-slate-800 rounded-xl p-3.5 space-y-1';
            item.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-white">${st.stageName}</span>
                <span class="text-[10px] px-2 py-0.5 rounded font-mono border ${badgeClass}">${st.state} ${icon}</span>
              </div>
              <p class="text-xs text-slate-400">${st.message || st.messageLocal || 'No stage message'}</p>
            `;
            stagesList.appendChild(item);
          });
        } else {
          stagesList.innerHTML = '<div class="text-xs text-slate-500 italic p-4 text-center">No stage breakdown available in current response.</div>';
        }

        // Render History Timeline
        const histList = document.getElementById('historyList');
        histList.innerHTML = '';

        if (history.length === 0) {
          histList.innerHTML = '<div class="text-xs text-slate-500 italic text-center py-6">No historical records yet.</div>';
        } else {
          history.forEach((h, index) => {
            const row = document.createElement('div');
            row.className = 'bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 space-y-2 hover:border-slate-700 transition-all';

            const timeStr = new Date(h.checked_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });
            
            let statusPill = '';
            if (h.status === 'Completed') statusPill = '<span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded font-mono">Completed</span>';
            else if (h.status === 'Processing') statusPill = '<span class="text-[10px] font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded font-mono">In Progress</span>';
            else statusPill = '<span class="text-[10px] font-bold text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded font-mono">Failed</span>';

            let hJsonPretty = '';
            try {
              const hj = typeof h.json_data === 'string' ? JSON.parse(h.json_data) : h.json_data;
              if (hj) hJsonPretty = JSON.stringify(hj, null, 2);
            } catch (e) {}

            row.innerHTML = `
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono text-slate-500 font-bold">#${history.length - index}</span>
                  ${statusPill}
                </div>
                <span class="text-[11px] font-mono text-slate-400">${timeStr}</span>
              </div>
              <div class="text-xs text-slate-300 leading-relaxed">${h.status_details || 'Check completed.'}</div>
              ${hJsonPretty ? `
                <div class="pt-1">
                  <button class="view-history-json text-[10px] font-mono text-indigo-400 hover:text-indigo-300 underline">View Stored JSON ▼</button>
                  <pre class="hist-pre hidden mt-2 p-2 bg-slate-950 border border-slate-800 rounded text-[9px] font-mono text-emerald-400 overflow-x-auto max-h-28 scrollbar-thin whitespace-pre leading-tight select-all">${hJsonPretty}</pre>
                </div>
              ` : ''}
            `;

            const btn = row.querySelector('.view-history-json');
            if (btn) {
              const pre = row.querySelector('.hist-pre');
              btn.addEventListener('click', () => {
                pre.classList.toggle('hidden');
                btn.innerText = pre.classList.contains('hidden') ? 'View Stored JSON ▼' : 'Hide Stored JSON ▲';
              });
            }

            histList.appendChild(row);
          });
        }
      }

      // Re-check button
      const recheckBtn = document.getElementById('recheckBtn');
      const recheckIcon = document.getElementById('recheckIcon');
      recheckBtn.addEventListener('click', async () => {
        if (!currentTrackerId) return;
        recheckIcon.classList.add('animate-spin');
        recheckBtn.disabled = true;

        try {
          await fetch(`/api/trackers/${currentTrackerId}/check`, { method: 'POST' });
          setTimeout(async () => {
            await loadDetails();
            recheckIcon.classList.remove('animate-spin');
            recheckBtn.disabled = false;
          }, 2000);
        } catch (err) {
          alert('Failed to trigger re-check: ' + err.message);
          recheckIcon.classList.remove('animate-spin');
          recheckBtn.disabled = false;
        }
      });

      loadDetails();
    });
  </script>
</body>
</html>
